name: Ingest PPR data

on:
  schedule:
    - cron: '0 6 * * 1'  # 06:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Re-enabling resets GitHub's 60-day inactivity timer for scheduled workflows.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: |
          for wf in ingest.yml ingest-external.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}
